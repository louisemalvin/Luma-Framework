name: GBFR FSR4.1 Build

on:
  push:
    branches: [fsr41-d3d11on12]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-gbfr:
    runs-on: windows-2025-vs2026
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1.1.2

    - name: Build ReShade x64 Release
      run: >-
        msbuild "Source\External\reshade\ReShade.sln"
        /p:Configuration=Release /p:Platform="64-bit"
        /p:PlatformToolset=v145

    - name: Build GBFR Test-Release x64
      run: >-
        msbuild Luma.sln /t:"Granblue Fantasy Relink"
        /p:Configuration=Test-Release /p:Platform=x64
        /p:DefineConstants="REMOTE_BUILD=1" /m

    - name: Package GBFR
      shell: pwsh
      run: |
        $buildDir = "Binaries\x64-Test-Release"
        $addon = Join-Path $buildDir "Luma-Granblue Fantasy Relink.addon"
        $reshade = "Source\External\reshade\bin\x64\Release\ReShade64.dll"
        $dlss = "Source\External\NGX\bin\rel\nvngx_dlss.dll"
        $compiler = "Shaders\Decompiler\d3dcompiler_47.dll"

        foreach ($required in @($addon, $reshade, $dlss, $compiler)) {
          if (-not (Test-Path $required)) {
            throw "Required GBFR package file not found: $required"
          }
        }

        $tempDir = "gbfr_package"
        Remove-Item -Recurse -Force $tempDir -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Path @(
          "$tempDir\Luma\Global",
          "$tempDir\Luma\Includes",
          "$tempDir\Luma\Granblue Fantasy Relink"
        ) -Force | Out-Null

        Copy-Item "Shaders\Global\*" "$tempDir\Luma\Global" -Recurse
        Copy-Item "Shaders\Includes\*" "$tempDir\Luma\Includes" -Recurse
        Copy-Item "Shaders\Granblue Fantasy Relink\*" "$tempDir\Luma\Granblue Fantasy Relink" -Recurse
        Copy-Item $compiler "$tempDir\Luma\d3dcompiler_47.dll"
        Copy-Item $reshade "$tempDir\dxgi.dll"
        Copy-Item $dlss "$tempDir\nvngx_dlss.dll"
        Copy-Item $addon "$tempDir\Luma-Granblue Fantasy Relink.addon"

        Compress-Archive -Path "$tempDir\*" -DestinationPath "Luma-Granblue_Fantasy_Relink-Test.zip" -Force
        Remove-Item -Recurse -Force $tempDir

    - name: Upload GBFR package
      uses: actions/upload-artifact@v4
      with:
        name: Package-GBFR-Test-Release-x64
        path: Luma-Granblue_Fantasy_Relink-Test.zip
